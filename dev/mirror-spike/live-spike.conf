# SPIKE option A (2026-11-06): Live/<address>/ is a local Maildir mirror of the
# provider (mbsync, pull-only, container mailhub-mirror-spike); the provider stays
# the source of truth. IMAP actions are recorded by replay-hook.lua and replayed
# on the provider. Virtual/ holds Cypht-style combined views.
mail_plugins {
  virtual = yes
  mail_lua = yes
  push_notification = yes
  push_notification_lua = yes
}
push_notification replay {
  driver = lua
  lua_file = /srv/vmail/replay-hook.lua
}
namespace live_contact {
  prefix = Live/contact@aptero.co/
  separator = /
  mail_driver = maildir
  mailbox_list_layout = fs
  mail_path = ~/live/contact
  mail_inbox_path = ~/live/contact/INBOX
  # Dovecot keeps its own files outside the mirror tree
  mail_index_path = ~/live-index/contact
  mail_control_path = ~/live-control/contact
  list = yes
  subscriptions = no
}
namespace virtual {
  prefix = Virtual/
  separator = /
  mail_driver = virtual
  mailbox_list_layout = fs
  mail_path = ~/virtual
  list = yes
  subscriptions = no
}
